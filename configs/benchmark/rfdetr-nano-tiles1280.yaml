schema_version: 1
purpose: exploratory
dataset:
  catalog_required: true
protocol:
  id: cross-dataset-tiles1280-v1
  resolution: 1280
  max_detections: 100
  checkpoint_metric: mAP50_95
  selection_split: val
  weight_policy: ema
  confidence: 0.001
  tile_iou: 0.5
  warmup: 5
  repeats: 10
model: ../experiments/models/rfdetr-nano.yaml
training:
  epochs: 10000
  batch: 1
  workers: 0
  seed: 42
  amp: true
  native:
    lr: 0.0001
    lr_encoder: 0.00015
    weight_decay: 0.0001
    warmup_epochs: 0
  amp_initial_scale: 256
  control:
    warmup_epochs: 3
    warmup_start_factor: 0.1
    patience: 25
    min_delta: 0.001
    plateau_patience: 10
    factor: 0.5
    min_factor: 0.01
    keep_resume: 2
runtime: ../experiments/runtime/rfdetr.yaml
