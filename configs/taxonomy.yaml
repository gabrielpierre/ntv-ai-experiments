version: "1.0"
reference: doc/tmp/scinet/external-datasets/sources/08-compact.txt
description: Componentes de LT; atributos ausentes permanecem unknown.
labels:
  torre_estaiada:
    attributes: {componente: [estrutura, fundacao_estrutura, estai, fundacao_estai]}
  torre_autoportante:
    attributes: {componente: [estrutura, pe_stub]}
  ferragem:
    attributes: {tipo: [manilha, olhal, grampo_suspensao]}
  fixacao:
    attributes: {tipo: [parafuso, pino, porca, contraporca, palnut]}
  isolador:
    attributes: {material: [vidro, polimero, ceramica]}
  cabo:
    attributes: {tipo: [para_raios, condutor]}
  sinalizacao:
    attributes:
      tipo: [advertencia, numeracao, fase, esfera]
      face: [frente, verso]
  faixa:
    attributes: {tipo: [servidao, acesso]}
  cerca:
    attributes: {}
  amortecedor:
    attributes: {tipo: [stock_bridge, espiralado]}
  espacador_hexagonal:
    attributes: {tamanho: [pequeno, grande]}
# Conceitos coarse para fontes externas. Não acrescentam subtipos à taxonomia fina.
coarse_labels:
  torre:
    attributes: {}
  espacador:
    attributes: {}
