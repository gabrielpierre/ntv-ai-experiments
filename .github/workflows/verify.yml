name: Verify paper release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[evaluation,dev,campaign]'
      - run: python -m pytest -m 'not gpu' -q
      - run: python scripts/paper.py verify
